name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - retailLead
      - management
      - operations
      - moneyHandling
      - techSupport
  workflow_dispatch:

permissions:
  contents: write   # peaceiris/actions-gh-pages needs write access to push to gh-pages branch
  pages: write
  id-token: write

# Each branch gets its own concurrency group so a slow branch can't block
# another, but rapid pushes to the same branch still queue rather than stomp.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_url: ${{ steps.vars.outputs.site_url }}
      dest_dir: ${{ steps.vars.outputs.dest_dir }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install pandoc and weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc weasyprint

      # Derive the public URL and gh-pages destination dir from the branch name.
      # main  → published at repo root  (dest ".")
      # other → published at /<branch>/ (dest "<branch>")
      - name: Set deploy path variables
        id: vars
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BRANCH="${{ github.ref_name }}"

          if [ "$BRANCH" = "main" ]; then
            SITE_URL="https://${OWNER}.github.io/${REPO}"
            DEST_DIR="."
          else
            SITE_URL="https://${OWNER}.github.io/${REPO}/${BRANCH}"
            DEST_DIR="${BRANCH}"
          fi

          echo "site_url=${SITE_URL}" >> $GITHUB_OUTPUT
          echo "dest_dir=${DEST_DIR}" >> $GITHUB_OUTPUT

      - name: Build site and exports
        run: make SITE_URL="${{ steps.vars.outputs.site_url }}"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ github.ref_name }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist

      # Deploys into the branch-specific subdirectory on the gh-pages branch.
      # keep_files: true preserves every other branch's deployed content so
      # one branch deployment never clobbers another.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ needs.build.outputs.dest_dir }}
          keep_files: true
