name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - management
      - operations
      - moneyHandling
      - retailLead
      - techSupport
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time, but don't cancel a running one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep this list in sync with the branch triggers above.
      VARIANT_BRANCHES: management operations moneyHandling retailLead techSupport
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch variant branches
        run: |
          for branch in $VARIANT_BRANCHES; do
            git fetch --depth=1 origin "$branch" || echo "::warning::Branch $branch not found, skipping"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install pandoc and weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc weasyprint

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------------
      # 1. Build main (root of the site)
      # ------------------------------------------------------------------
      - name: Build main site
        env:
          PAGES_SITE: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: make SITE_URL="${{ steps.pages.outputs.base_url }}"

      - name: Collect main output
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r dist/* "$RUNNER_TEMP/site/"

      # ------------------------------------------------------------------
      # 2. Build each variant branch into its own subdirectory
      # ------------------------------------------------------------------
      - name: Build variant branches
        env:
          PAGES_SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          for branch in $VARIANT_BRANCHES; do
            if ! git rev-parse --verify "origin/$branch" >/dev/null 2>&1; then
              echo "::warning::Branch $branch not found, skipping"
              continue
            fi

            echo "::group::Building $branch"

            # Swap in only the resume content from the variant branch
            git checkout "origin/$branch" -- src/content/resume.md

            # Clean previous build artifacts
            rm -rf dist .astro

            # Build with the variant's base path so asset/link URLs are correct
            VARIANT_BASE="${BASE_PATH%/}/$branch"
            export PAGES_BASE_PATH="$VARIANT_BASE"
            VARIANT_URL="${PAGES_SITE}${VARIANT_BASE}/"

            make SITE_URL="$VARIANT_URL"

            # Copy into the combined site tree
            mkdir -p "$RUNNER_TEMP/site/$branch"
            cp -r dist/* "$RUNNER_TEMP/site/$branch/"

            # Restore main's content for the next iteration
            git checkout main -- src/content/resume.md

            echo "::endgroup::"
          done

          # Replace dist/ with the combined output
          rm -rf dist
          cp -r "$RUNNER_TEMP/site" dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
